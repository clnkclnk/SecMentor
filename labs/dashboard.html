<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecMentor 学习进度 — clnk</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 24px;
  }

  .container { max-width: 960px; margin: 0 auto; }

  /* ===== Header ===== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid #1e1e3a;
  }
  .header-left h1 {
    font-size: 24px;
    font-weight: 700;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header-left p { font-size: 13px; color: #888; margin-top: 4px; }
  .streak-badge {
    background: linear-gradient(135deg, #f093fb, #f5576c);
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ===== Cards Grid ===== */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }

  .card {
    background: #16162a;
    border: 1px solid #252547;
    border-radius: 12px;
    padding: 20px;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(102, 126, 234, 0.15); }

  .card-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .card-value { font-size: 32px; font-weight: 800; line-height: 1; }
  .card-sub { font-size: 12px; color: #666; margin-top: 6px; }

  /* Card colors */
  .points-card .card-value { color: #fbbf24; }
  .level-card .card-value { color: #a78bfa; font-size: 22px; }
  .streak-card .card-value { color: #f87171; }
  .next-card .card-value { color: #34d399; font-size: 20px; }

  /* ===== Progress Bar ===== */
  .progress-section { margin-bottom: 24px; }
  .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .progress-title { font-size: 14px; font-weight: 600; color: #aaa; }
  .progress-pct { font-size: 13px; color: #667eea; font-weight: 700; }
  .progress-bar-bg {
    height: 12px;
    background: #1e1e3a;
    border-radius: 6px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #667eea, #764ba2);
    border-radius: 6px;
    transition: width 1s ease-out;
    width: 0%;
  }

  /* ===== Stage Map ===== */
  .stage-map { margin-bottom: 24px; }
  .section-title { font-size: 16px; font-weight: 700; color: #ccc; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .section-title::before { content: ''; display: inline-block; width: 4px; height: 18px; background: linear-gradient(180deg, #667eea, #764ba2); border-radius: 2px; }

  .stage-row {
    display: flex;
    align-items: stretch;
    gap: 12px;
    margin-bottom: 12px;
  }
  .stage-tag {
    background: #1e1e3a;
    border: 1px solid #2a2a50;
    border-radius: 8px;
    padding: 14px 16px;
    min-width: 80px;
    text-align: center;
    font-weight: 700;
    font-size: 15px;
    flex-shrink: 0;
  }
  .stage-tag.done { border-color: #34d399; color: #34d399; background: rgba(52,211,153,0.08); }
  .stage-tag.active { border-color: #667eea; color: #667eea; background: rgba(102,126,234,0.1); animation: pulse 2s infinite; }
  .stage-tag.locked { border-color: #333; color: #555; }

  .topics-track {
    flex: 1;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .topic-dot {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
    position: relative;
  }
  .topic-dot.passed { background: #34d399; color: #0f0f1a; cursor: default; }
  .topic-dot.current { background: #667eea; color: #fff; animation: pulse 2s infinite; }
  .topic-dot.locked { background: #222240; color: #555; border: 1px dashed #333; }
  .topic-dot .tooltip {
    visibility: hidden;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: #252550;
    border: 1px solid #3a3a60;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    white-space: nowrap;
    z-index: 10;
    font-weight: 400;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .topic-dot:hover .tooltip { visibility: visible; opacity: 1; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(102,126,234,0.4); }
    50% { box-shadow: 0 0 0 8px rgba(102,126,234,0); }
  }

  /* ===== Timeline ===== */
  .timeline { margin-bottom: 32px; }
  .day-block {
    background: #16162a;
    border: 1px solid #252547;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 12px;
    position: relative;
    padding-left: 44px;
  }
  .day-block::before {
    content: '';
    position: absolute;
    left: 18px;
    top: 28px;
    bottom: -12px;
    width: 2px;
    background: #252547;
  }
  .day-block:last-child::before { display: none; }
  .day-date {
    position: absolute;
    left: 14px;
    top: 16px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #667eea;
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .day-title { font-size: 15px; font-weight: 700; color: #ddd; margin-bottom: 8px; }
  .day-events { display: flex; flex-direction: column; gap: 6px; }
  .event-item {
    font-size: 13px;
    color: #aaa;
    padding: 8px 12px;
    background: #1e1e3a;
    border-radius: 8px;
    border-left: 3px solid #667eea;
    line-height: 1.5;
  }
  .event-item.stage-event { border-left-color: #fbbf24; }
  .event-item .pts { float: right; color: #34d399; font-weight: 700; font-size: 12px; }

  /* ===== Radar ===== */
  .radar-section { margin-bottom: 24px; }
  .radar-container { display: flex; justify-content: center; padding: 20px 0; }

  /* Footer */
  .footer {
    text-align: center;
    font-size: 12px;
    color: #444;
    padding: 20px 0;
    border-top: 1px solid #1e1e3a;
  }
</style>

// ========== 等级表（新版称号体系，与 progress.json 对齐） ==========
const LEVELS = [
  { min: 0,    max: 49,   title: "门外汉",     color: "#888" },
  { min: 50,   max: 149,  title: "记名弟子",   color: "#a78bfa" },
  { min: 150,  max: 299,  title: "入室弟子",   color: "#60a5fa" },

  { min: 370,  max: 699,  title: "威震江湖",   color: "#ef4444" },
  { min: 700,  max: 99999,title: "一代宗师",   color: "#f59e0b" },
];

// ========== 渲染函数 ==========
function render() {
  // 卡片
  document.getElementById('total-points').textContent = DATA.totalPoints;
  document.getElementById('level-title').textContent = DATA.levelTitle;
  document.getElementById('level-num').textContent = `Level ${DATA.level}`;
  document.getElementById('streak-val').textContent = DATA.streakDays + ' 天';
  document.getElementById('streak-num').textContent = DATA.streakDays;
  document.getElementById('update-time').textContent = `最后更新：${DATA.updatedAt.replace('T', ' ').replace('+08:00', '')}`;

  // 距下一级
  const currentLvl = LEVELS.find(l => DATA.totalPoints >= l.min && DATA.totalPoints <= l.max) || LEVELS[LEVELS.length - 1];
  const nextLvl = LEVELS[LEVELS.indexOf(currentLvl) + 1];
  if (nextLvl) {
    const need = nextLvl.min - DATA.totalPoints;
    document.getElementById('next-level').textContent = `还差 ${need} 分`;
    document.getElementById('next-level-name').textContent = `→ ${nextLvl.title}`;
  } else {
    document.getElementById('next-level').textContent = '已满级!';
    document.getElementById('next-level-name').textContent = '你是传说！';
  }

  // 进度条
  const pct = ((DATA.totalPoints - currentLvl.min) / (currentLvl.max - currentLvl.min)) * 100;
  const bar = document.getElementById('level-bar');
  document.getElementById('level-pct').textContent = `${Math.round(pct)}%`;
  setTimeout(() => bar.style.width = pct + '%', 100);

  // 通关地图
  const stageContainer = document.getElementById('stage-container');
  stageContainer.innerHTML = '';
  DATA.stages.forEach(stage => {
    const row = document.createElement('div');
    row.className = 'stage-row';

    let tagClass = stage.status === 'done' ? 'done' : stage.status === 'active' ? 'active' : 'locked';
    row.innerHTML = `<div class="stage-tag ${tagClass}">${stage.name}</div><div class="topics-track">`;

    stage.topics.forEach(t => {
      let dotClass = t.status === 'passed' ? 'passed' : t.status === 'current' ? 'current' : 'locked';
      let icon = t.status === 'passed' ? '✓' : t.name;
      let tooltip = `<span class="tooltip">${t.name}${t.date ? ' (' + t.date + ')' : ''}</span>`;
      row.innerHTML += `<div class="topic-dot ${dotClass}">${icon}${tooltip}</div>`;
    });

    row.innerHTML += '</div>';
    stageContainer.appendChild(row);
  });

  // 时间线
  const tlContainer = document.getElementById('timeline-container');
  tlContainer.innerHTML = '';
  DATA.timeline.forEach(day => {
    const block = document.createElement('div');
    block.className = 'day-block';
    block.innerHTML = `<div class="day-date">${day.day}</div><div class="day-title">${day.date} ${day.weekday}</div><div class="day-events">`;

    day.events.forEach(e => {
      block.innerHTML += `<div class="event-item ${e.type === 'stage' ? 'stage-event' : ''}">${e.text}${e.pts ? '<span class="pts">' + e.pts + '</span>' : ''}</div>`;
    });
    block.innerHTML += '</div>';
    tlContainer.appendChild(block);
  });

  // 雷达图
  drawRadar();
}

// ========== 雷达图绘制 ==========
function drawRadar() {
  const canvas = document.getElementById('radarCanvas');
  const ctx = canvas.getContext('2d');
  const cx = 200, cy = 155, radius = 110;

  const labels = ['网络', 'Linux', 'HTTP', 'Web应用', '编程', '安全', '工具'];
  const values = [DATA.skills.net, DATA.skills.linux, DATA.skills.http, DATA.skills.webapp, DATA.skills.prog, DATA.skills.sec, DATA.skills.tooling];
  const maxVal = 5;
  const n = labels.length;
  const angleStep = (Math.PI * 2) / n;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 背景网格
  for (let r = 1; r <= 5; r++) {
    ctx.beginPath();
    const rr = (radius / 5) * r;
    for (let i = 0; i <= n; i++) {
      const a = angleStep * i - Math.PI / 2;
      const x = cx + Math.cos(a) * rr;
      const y = cy + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = r === 5 ? '#3a3a60' : '#222240';
    ctx.lineWidth = r === 5 ? 1.5 : 0.5;
    ctx.stroke();
  }

  // 轴线
  for (let i = 0; i < n; i++) {
    const a = angleStep * i - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius);
    ctx.strokeStyle = '#222240';
    ctx.stroke();
  }

  // 数据区域
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const idx = i % n;
    const a = angleStep * idx - Math.PI / 2;
    const val = Math.max(0, Math.min(values[idx], maxVal)) / maxVal;
    const x = cx + Math.cos(a) * radius * val;
    const y = cy + Math.sin(a) * radius * val;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(102, 126, 234, 0.2)';
  ctx.fill();
  ctx.strokeStyle = '#667eea';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 数据点
  for (let i = 0; i < n; i++) {
    const a = angleStep * i - Math.PI / 2;
    const val = Math.max(0, Math.min(values[i], maxVal)) / maxVal;
    const x = cx + Math.cos(a) * radius * val;
    const y = cy + Math.sin(a) * radius * val;
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#a78bfa';
    ctx.fill();
  }

  // 标签
  ctx.font = '12px -apple-system, sans-serif';
  ctx.fillStyle = '#888';
  ctx.textAlign = 'center';
  for (let i = 0; i < n; i++) {
    const a = angleStep * i - Math.PI / 2;
    const x = cx + Math.cos(a) * (radius + 22);
    const y = cy + Math.sin(a) * (radius + 22);
    ctx.fillText(labels[i], x, y + 4);
  }
}

// 启动
render();
</script>
</body>
</html>
